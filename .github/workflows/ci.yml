name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ============================================================================
  # Canonical Quality Gate (macOS Apple Silicon arm64)
  # Runs formatting check, clang-tidy static analysis, and contract smoke tests.
  # Avoids duplicating expensive static analysis across multiple platform jobs.
  # ============================================================================
  quality-gates:
    name: Quality Gates (Formatting, Clang-Tidy, Contracts)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
        run: |
          brew install openssl@3 protobuf grpc googletest llvm@18 ninja nlohmann-json cpp-httplib libpqxx libpq
          echo "$(brew --prefix llvm@18)/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/libpq/bin" >> $GITHUB_PATH

      - name: Configure CMake with Static Analysis
        run: |
          cmake --preset ci-macos -DENABLE_CLANG_TIDY=ON

      - name: Check Formatting (.clang-format)
        run: |
          cmake --build --preset ci-macos --target check-format

      - name: Run Clang-Tidy & Build Contract Targets
        run: |
          cmake --build --preset ci-macos --target securecloud_proto_smoke_test

      - name: Validate Generated Protobuf & gRPC Contracts
        run: |
          cmake --build --preset ci-macos --target verify-contracts

  # ============================================================================
  # Native macOS Build & Test Job (Apple Silicon arm64)
  # ============================================================================
  macos-build-test:
    name: macOS (AppleClang / arm64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expose GitHub Actions Cache Credentials for sccache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2 || 'on');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure sccache Environment
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "ACTIONS_CACHE_URL=${ACTIONS_CACHE_URL}" >> "$GITHUB_ENV"
          echo "ACTIONS_RUNTIME_TOKEN=${ACTIONS_RUNTIME_TOKEN}" >> "$GITHUB_ENV"
          echo "ACTIONS_CACHE_SERVICE_V2=on" >> "$GITHUB_ENV"
          echo "ACTIONS_RESULTS_URL=${ACTIONS_RESULTS_URL}" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
          sccache --start-server
          sccache --show-stats

      - name: Install Homebrew dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
        run: |
          brew install openssl@3 protobuf grpc googletest ninja nlohmann-json cpp-httplib libpqxx libpq
          echo "/opt/homebrew/opt/openssl@3/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/libpq/bin" >> "$GITHUB_PATH"

      - name: Generate Development PKI Certificates
        run: |
          bash scripts/generate-dev-pki.sh --force

      - name: Configure CMake
        run: |
          cmake --preset ci-macos -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build All Targets
        run: |
          cmake --build --preset ci-macos --parallel

      - name: Show sccache Stats
        run: |
          sccache --show-stats

      - name: Execute CTest Suite
        run: |
          ctest --preset ci-macos --output-on-failure --parallel 4

  # ============================================================================
  # Native Windows MSVC Build & Test Job (MSVC 2022 / vcpkg)
  # ============================================================================
  windows-msvc-build-test:
    name: Windows (MSVC 2022 / vcpkg)
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg_archives
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg_downloads
      SCCACHE_GHA_ENABLED: "true"
      ACTIONS_CACHE_SERVICE_V2: "on"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Windows Defender Exclusions
        shell: pwsh
        run: |
          Write-Host "Disabling Windows Defender Realtime Monitoring for CI build performance..."
          Set-MpPreference -DisableRealtimeMonitoring $true
          Add-MpPreference -ExclusionPath "${{ github.workspace }}", "C:\vcpkg", "D:\a", "$env:TEMP"

      - name: Expose GitHub Actions Cache Credentials for sccache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2 || 'on');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('SCCACHE_GHA_ENABLED', 'true');

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        env:
          SCCACHE_GHA_ENABLED: "true"
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          ACTIONS_CACHE_SERVICE_V2: "on"
          ACTIONS_RESULTS_URL: ${{ env.ACTIONS_RESULTS_URL }}

      - name: Configure sccache Environment
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: "true"
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          ACTIONS_CACHE_SERVICE_V2: "on"
          ACTIONS_RESULTS_URL: ${{ env.ACTIONS_RESULTS_URL }}
        run: |
          "SCCACHE_GHA_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ACTIONS_CACHE_URL=$env:ACTIONS_CACHE_URL" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ACTIONS_RUNTIME_TOKEN=$env:ACTIONS_RUNTIME_TOKEN" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ACTIONS_CACHE_SERVICE_V2=on" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ACTIONS_RESULTS_URL=$env:ACTIONS_RESULTS_URL" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_C_COMPILER_LAUNCHER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_CXX_COMPILER_LAUNCHER=sccache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & sccache --stop-server 2>$null
          & sccache --start-server
          & sccache --show-stats

      - name: Restore vcpkg binary archives and downloads
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/.vcpkg_archives
            ${{ github.workspace }}/.vcpkg_downloads
          key: vcpkg-msvc-v3-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-msvc-v3-
            vcpkg-msvc-v2-
            vcpkg-msvc-

      - name: Ensure vcpkg cache directories exist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/.vcpkg_archives"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/.vcpkg_downloads"

      - name: Pre-fetch vcpkg tools
        shell: pwsh
        run: |
          $cmakeZip = "${{ github.workspace }}/.vcpkg_downloads/cmake-4.4.3-windows-x86_64.zip"
          $needsDownload = $true
          if (Test-Path -Path $cmakeZip) {
            $file = Get-Item -Path $cmakeZip
            if ($file.Length -gt 10000000) {
              $needsDownload = $false
              Write-Host "cmake-4.4.3-windows-x86_64.zip already cached ($($file.Length) bytes)."
            }
          }

          if ($needsDownload) {
            Write-Host "Pre-fetching cmake-4.4.3-windows-x86_64.zip with retries..."
            $url = "https://github.com/Kitware/CMake/releases/download/v4.4.3/cmake-4.4.3-windows-x86_64.zip"
            $retries = 5
            for ($i = 1; $i -le $retries; $i++) {
              Write-Host "Download attempt $i of $retries..."
              & curl.exe -sSL --retry 3 --retry-delay 5 -o $cmakeZip $url
              if (Test-Path -Path $cmakeZip) {
                $downloaded = Get-Item -Path $cmakeZip
                if ($downloaded.Length -gt 10000000) {
                  Write-Host "Successfully downloaded cmake 4.4.3 ($($downloaded.Length) bytes)"
                  break
                }
              }
              Write-Host "Attempt $i produced incomplete file, retrying in 10s..."
              Start-Sleep -Seconds 10
            }
          }

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure Ninja build system path
        shell: pwsh
        run: |
          "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Ensure vcpkg baseline commit
        shell: pwsh
        run: |
          $hasCommit = git -C $env:VCPKG_INSTALLATION_ROOT cat-file -e b322364f06308bdd24823f9d8f03fe0cc86fd46f 2>$null; $LASTEXITCODE -eq 0
          if (-not $hasCommit) {
            Write-Host "Fetching specific vcpkg baseline commit..."
            git -C $env:VCPKG_INSTALLATION_ROOT fetch --depth=1 origin b322364f06308bdd24823f9d8f03fe0cc86fd46f
          }

      - name: Configure CMake with MSVC & vcpkg
        shell: pwsh
        run: |
          $maxAttempts = 3
          $attempt = 1
          while ($attempt -le $maxAttempts) {
            Write-Host "Configuring CMake with vcpkg (attempt $attempt of $maxAttempts)..."
            cmake --preset ci-windows-msvc -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_MAKE_PROGRAM="C:/Program Files/Microsoft Visual Studio/2022/Enterprise/Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja/ninja.exe" -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq $maxAttempts) { exit $LASTEXITCODE }
            Write-Host "CMake configuration failed, retrying in 10s..."
            Start-Sleep -Seconds 10
            $attempt++
          }

      - name: Save vcpkg binary archives and downloads
        uses: actions/cache/save@v4
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: |
            ${{ github.workspace }}/.vcpkg_archives
            ${{ github.workspace }}/.vcpkg_downloads
          key: vcpkg-msvc-v3-${{ hashFiles('vcpkg.json') }}

      - name: Build All Targets
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: "true"
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          ACTIONS_CACHE_SERVICE_V2: "on"
          ACTIONS_RESULTS_URL: ${{ env.ACTIONS_RESULTS_URL }}
        run: |
          cmake --build --preset ci-windows-msvc --parallel

      - name: Show sccache Stats
        shell: pwsh
        run: |
          sccache --show-stats

      - name: Generate Development PKI Certificates
        shell: bash
        run: |
          bash scripts/generate-dev-pki.sh --force

      - name: Execute CTest Suite
        shell: pwsh
        run: |
          ctest --preset ci-windows-msvc --output-on-failure --parallel 4

  # ============================================================================
  # Native Windows MinGW Build & Test Job (MSYS2 MINGW64 / GCC 15+)
  # ============================================================================
  windows-mingw-build-test:
    name: Windows (MinGW-w64 MINGW64 / GCC 15+)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Windows Defender Exclusions & Pacman Settings
        shell: pwsh
        run: |
          Write-Host "Disabling Windows Defender Realtime Monitoring for CI build performance..."
          Set-MpPreference -DisableRealtimeMonitoring $true
          Add-MpPreference -ExclusionPath "${{ github.workspace }}", "C:\msys64", "D:\a", "$env:TEMP"
          if (Test-Path "C:\msys64\etc\pacman.conf") {
            Write-Host "Configuring DisableDownloadTimeout in pre-installed MSYS2..."
            (Get-Content "C:\msys64\etc\pacman.conf") -replace '^#DisableDownloadTimeout', 'DisableDownloadTimeout' | Set-Content "C:\msys64\etc\pacman.conf"
          }

      - name: Restore MSYS2 Pacman Cache
        uses: actions/cache@v4
        with:
          path: C:\msys64\var\cache\pacman\pkg
          key: msys2-pacman-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            msys2-pacman-${{ runner.os }}-

      - name: Expose GitHub Actions Cache Credentials for sccache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2 || 'on');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Set up MSYS2 MINGW64 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: false
          path-type: minimal

      - name: Install MinGW64 Dependencies with Retries
        shell: msys2 {0}
        run: |
          # Disable pacman low-speed timeout to prevent aborts on slow mirrors
          sed -i 's/^#DisableDownloadTimeout/DisableDownloadTimeout/' /etc/pacman.conf
          grep -q "DisableDownloadTimeout" /etc/pacman.conf || sed -i '/\[options\]/a DisableDownloadTimeout' /etc/pacman.conf

          PACKAGES=(
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-sccache
            mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-grpc
            mingw-w64-x86_64-gtest
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-nlohmann-json
            mingw-w64-x86_64-libpqxx
          )

          installed=0
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt of 5: Installing MinGW64 packages..."
            if pacman -Sy --needed --noconfirm --disable-download-timeout "${PACKAGES[@]}"; then
              installed=1
              break
            fi
            echo "Pacman download attempt $attempt failed, retrying in 10s..."
            sleep 10
          done

          if [ $installed -ne 1 ]; then
            echo "FATAL: Failed to install MinGW64 packages after 5 attempts."
            exit 1
          fi

      - name: Initialize sccache Daemon (MinGW MINGW64)
        shell: msys2 {0}
        env:
          SCCACHE_GHA_ENABLED: "true"
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          ACTIONS_CACHE_SERVICE_V2: ${{ env.ACTIONS_CACHE_SERVICE_V2 }}
          ACTIONS_RESULTS_URL: ${{ env.ACTIONS_RESULTS_URL }}
          MSYS2_ENV_CONV_EXCL: "ACTIONS_CACHE_URL;ACTIONS_RESULTS_URL"
        run: |
          sccache --start-server
          sccache --show-stats

      - name: Configure CMake (MinGW MINGW64)
        shell: msys2 {0}
        env:
          SCCACHE_GHA_ENABLED: "true"
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          ACTIONS_CACHE_SERVICE_V2: ${{ env.ACTIONS_CACHE_SERVICE_V2 }}
          ACTIONS_RESULTS_URL: ${{ env.ACTIONS_RESULTS_URL }}
          MSYS2_ENV_CONV_EXCL: "ACTIONS_CACHE_URL;ACTIONS_RESULTS_URL"
          CMAKE_C_COMPILER_LAUNCHER: "sccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "sccache"
        run: |
          cmake --preset ci-windows-mingw -DCMAKE_NO_SYSTEM_FROM_IMPORTED=ON

      - name: Build All Targets (MinGW MINGW64)
        shell: msys2 {0}
        env:
          SCCACHE_GHA_ENABLED: "true"
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          ACTIONS_CACHE_SERVICE_V2: ${{ env.ACTIONS_CACHE_SERVICE_V2 }}
          ACTIONS_RESULTS_URL: ${{ env.ACTIONS_RESULTS_URL }}
          MSYS2_ENV_CONV_EXCL: "ACTIONS_CACHE_URL;ACTIONS_RESULTS_URL"
        run: |
          cmake --build --preset ci-windows-mingw --parallel

      - name: Show sccache Stats
        shell: msys2 {0}
        run: |
          sccache --show-stats

      - name: Generate Development PKI Certificates (MinGW MINGW64)
        shell: msys2 {0}
        run: |
          bash scripts/generate-dev-pki.sh --force

      - name: Execute CTest Suite (MinGW MINGW64)
        shell: msys2 {0}
        run: |
          ctest --preset ci-windows-mingw --output-on-failure
