name: securecloud

services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/gateway/Dockerfile
    environment:
      SECURECLOUD_GRPC_HOST: "0.0.0.0"
      SECURECLOUD_GATEWAY_GRPC_PORT: "50051"
      SECURECLOUD_CA_CERT_PATH: /etc/securecloud/certs/ca.crt
      SECURECLOUD_SERVICE_CERT_PATH: /etc/securecloud/certs/service.crt
      SECURECLOUD_SERVICE_KEY_PATH: /etc/securecloud/certs/service.key
      SECURECLOUD_GATEWAY_AUTH_ENDPOINT: auth:50052
      SECURECLOUD_GATEWAY_MESSAGING_ENDPOINT: messaging:50053
      SECURECLOUD_GATEWAY_FILES_ENDPOINT: files:50054
      SECURECLOUD_GATEWAY_AUDIT_ENDPOINT: audit:50055
      SECURECLOUD_GATEWAY_PEER_PROBE_TARGET: ${SECURECLOUD_GATEWAY_PEER_PROBE_TARGET:-auth:50052}
      SECURECLOUD_GATEWAY_PEER_PROBE_NAME: ${SECURECLOUD_GATEWAY_PEER_PROBE_NAME:-auth}
    volumes:
      - type: bind
        source: ../../deploy/dev-pki/ca/ca.crt
        target: /etc/securecloud/certs/ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../deploy/dev-pki/services/gateway/gateway.crt
        target: /etc/securecloud/certs/service.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../deploy/dev-pki/services/gateway/gateway.key
        target: /etc/securecloud/certs/service.key
        read_only: true
        bind:
          create_host_path: false
    networks:
      - securecloud-dev
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-50051}:50051"
    depends_on:
      auth:
        condition: service_started

  auth:
    build:
      context: ../..
      dockerfile: deploy/docker/auth/Dockerfile
    environment:
      SECURECLOUD_GRPC_HOST: "0.0.0.0"
      SECURECLOUD_AUTH_GRPC_PORT: "50052"
      SECURECLOUD_CA_CERT_PATH: /etc/securecloud/certs/ca.crt
      SECURECLOUD_SERVICE_CERT_PATH: /etc/securecloud/certs/service.crt
      SECURECLOUD_SERVICE_KEY_PATH: /etc/securecloud/certs/service.key
      SECURECLOUD_AUTH_DB_HOST: postgres
      SECURECLOUD_AUTH_DB_PORT: "5432"
      SECURECLOUD_AUTH_DB_NAME: ${AUTH_DB_NAME:-securecloud_auth}
      SECURECLOUD_AUTH_DB_USER: ${AUTH_DB_USER:-auth_user}
      SECURECLOUD_AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_dev_db_secret}
    volumes:
      - type: bind
        source: ../../deploy/dev-pki/ca/ca.crt
        target: /etc/securecloud/certs/ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../deploy/dev-pki/services/auth/auth.crt
        target: /etc/securecloud/certs/service.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../deploy/dev-pki/services/auth/auth.key
        target: /etc/securecloud/certs/service.key
        read_only: true
        bind:
          create_host_path: false
    networks:
      - securecloud-dev
    ports:
      - "127.0.0.1:${AUTH_HOST_PORT:-50052}:50052"
    depends_on:
      postgres:
        condition: service_healthy

  messaging:
    build:
      context: ../..
      dockerfile: deploy/docker/messaging/Dockerfile
    environment:
      SECURECLOUD_GRPC_HOST: "0.0.0.0"
      SECURECLOUD_MESSAGING_GRPC_PORT: "50053"
      SECURECLOUD_CA_CERT_PATH: /etc/securecloud/certs/ca.crt
      SECURECLOUD_SERVICE_CERT_PATH: /etc/securecloud/certs/service.crt
      SECURECLOUD_SERVICE_KEY_PATH: /etc/securecloud/certs/service.key
      SECURECLOUD_MESSAGING_SCYLLA_HOST: scylladb
      SECURECLOUD_MESSAGING_SCYLLA_PORT: "9042"
      SECURECLOUD_MESSAGING_SCYLLA_KEYSPACE: ${MESSAGING_SCYLLA_KEYSPACE:-securecloud_messaging}
    volumes:
      - type: bind
        source: ../../deploy/dev-pki/ca/ca.crt
        target: /etc/securecloud/certs/ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../deploy/dev-pki/services/messaging/messaging.crt
        target: /etc/securecloud/certs/service.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../deploy/dev-pki/services/messaging/messaging.key
        target: /etc/securecloud/certs/service.key
        read_only: true
        bind:
          create_host_path: false
    networks:
      - securecloud-dev
    ports:
      - "127.0.0.1:${MESSAGING_HOST_PORT:-50053}:50053"
    depends_on:
      scylladb:
        condition: service_healthy

  files:
    build:
      context: ../..
      dockerfile: deploy/docker/files/Dockerfile
    environment:
      SECURECLOUD_GRPC_HOST: "0.0.0.0"
      SECURECLOUD_FILES_GRPC_PORT: "50054"
      SECURECLOUD_CA_CERT_PATH: /etc/securecloud/certs/ca.crt
      SECURECLOUD_SERVICE_CERT_PATH: /etc/securecloud/certs/service.crt
      SECURECLOUD_SERVICE_KEY_PATH: /etc/securecloud/certs/service.key
      SECURECLOUD_FILES_DB_HOST: postgres
      SECURECLOUD_FILES_DB_PORT: "5432"
      SECURECLOUD_FILES_DB_NAME: ${FILES_DB_NAME:-securecloud_files}
      SECURECLOUD_FILES_DB_USER: ${FILES_DB_USER:-files_user}
      SECURECLOUD_FILES_DB_PASSWORD: ${FILES_DB_PASSWORD:-files_dev_db_secret}
      SECURECLOUD_FILES_S3_ENDPOINT: http://minio:9000
      SECURECLOUD_FILES_S3_BUCKET: ${FILES_MINIO_BUCKET:-securecloud-files-encrypted}
      SECURECLOUD_FILES_S3_ACCESS_KEY: ${FILES_MINIO_USER:-files_minio_user}
      SECURECLOUD_FILES_S3_SECRET_KEY: ${FILES_MINIO_PASSWORD:-files_dev_minio_secret}
    volumes:
      - type: bind
        source: ../../deploy/dev-pki/ca/ca.crt
        target: /etc/securecloud/certs/ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../deploy/dev-pki/services/files/files.crt
        target: /etc/securecloud/certs/service.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../deploy/dev-pki/services/files/files.key
        target: /etc/securecloud/certs/service.key
        read_only: true
        bind:
          create_host_path: false
    networks:
      - securecloud-dev
    ports:
      - "127.0.0.1:${FILES_HOST_PORT:-50054}:50054"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  audit:
    build:
      context: ../..
      dockerfile: deploy/docker/audit/Dockerfile
    environment:
      SECURECLOUD_GRPC_HOST: "0.0.0.0"
      SECURECLOUD_AUDIT_GRPC_PORT: "50055"
      SECURECLOUD_CA_CERT_PATH: /etc/securecloud/certs/ca.crt
      SECURECLOUD_SERVICE_CERT_PATH: /etc/securecloud/certs/service.crt
      SECURECLOUD_SERVICE_KEY_PATH: /etc/securecloud/certs/service.key
      SECURECLOUD_AUDIT_DB_HOST: clickhouse
      SECURECLOUD_AUDIT_DB_PORT: "8123"
      SECURECLOUD_AUDIT_DB_NAME: ${AUDIT_DB_NAME:-securecloud_audit}
      SECURECLOUD_AUDIT_DB_USER: ${AUDIT_DB_USER:-audit_user}
      SECURECLOUD_AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-audit_dev_db_secret}
    volumes:
      - type: bind
        source: ../../deploy/dev-pki/ca/ca.crt
        target: /etc/securecloud/certs/ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../deploy/dev-pki/services/audit/audit.crt
        target: /etc/securecloud/certs/service.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../deploy/dev-pki/services/audit/audit.key
        target: /etc/securecloud/certs/service.key
        read_only: true
        bind:
          create_host_path: false
    networks:
      - securecloud-dev
    ports:
      - "127.0.0.1:${AUDIT_HOST_PORT:-50055}:50055"
    depends_on:
      clickhouse:
        condition: service_healthy

  postgres:
    image: postgres:17.0-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres_dev_admin_secret}
      POSTGRES_DB: postgres
      AUTH_DB_NAME: ${AUTH_DB_NAME:-securecloud_auth}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_dev_db_secret}
      FILES_DB_NAME: ${FILES_DB_NAME:-securecloud_files}
      FILES_DB_USER: ${FILES_DB_USER:-files_user}
      FILES_DB_PASSWORD: ${FILES_DB_PASSWORD:-files_dev_db_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./postgres/init-databases.sh
        target: /docker-entrypoint-initdb.d/init-databases.sh
        read_only: true
        bind:
          create_host_path: false
    networks:
      - securecloud-dev
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  scylladb:
    image: scylladb/scylla:6.0.1
    command: --developer-mode=1 --smp 1 --memory 512M
    environment:
      SCYLLA_CLUSTER_NAME: ${SCYLLA_CLUSTER_NAME:-securecloud-dev-cluster}
    volumes:
      - scylla-data:/var/lib/scylla
    networks:
      - securecloud-dev
    ports:
      - "127.0.0.1:${SCYLLA_HOST_PORT:-9042}:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e \"SHOW HOST\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8.3.59-alpine
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-clickhouse_dev_admin_secret}
      AUDIT_DB_NAME: ${AUDIT_DB_NAME:-securecloud_audit}
      AUDIT_DB_USER: ${AUDIT_DB_USER:-audit_user}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-audit_dev_db_secret}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - type: bind
        source: ./clickhouse/init-clickhouse.sql
        target: /docker-entrypoint-initdb.d/init-clickhouse.sql
        read_only: true
        bind:
          create_host_path: false
    networks:
      - securecloud-dev
    ports:
      - "127.0.0.1:${CLICKHOUSE_HOST_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_HOST_NATIVE_PORT:-9009}:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: quay.io/minio/minio:RELEASE.2024-08-03T04-33-23Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_secret}
    volumes:
      - minio-data:/data
    networks:
      - securecloud-dev
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_HOST_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_secret}
      FILES_MINIO_BUCKET: ${FILES_MINIO_BUCKET:-securecloud-files-encrypted}
      FILES_MINIO_USER: ${FILES_MINIO_USER:-files_minio_user}
      FILES_MINIO_PASSWORD: ${FILES_MINIO_PASSWORD:-files_dev_minio_secret}
    volumes:
      - type: bind
        source: ./minio/init-minio.sh
        target: /init-minio.sh
        read_only: true
        bind:
          create_host_path: false
    networks:
      - securecloud-dev
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

networks:
  securecloud-dev:
    driver: bridge

volumes:
  postgres-data:
  scylla-data:
  clickhouse-data:
  minio-data:
