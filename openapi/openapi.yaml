openapi: 3.0.3
info:
  title: SecureCloud Gateway REST API
  description: >
    SecureCloud API Gateway proxying client REST requests to downstream microservices
    (Auth, Messaging, Files, Audit) over gRPC. Invariant: Never performs direct database access on Gateway (ADR-005).
  version: 1.0.0
  contact:
    name: SecureCloud Engineering Team

servers:
  - url: https://api.securecloud.internal
    description: Internal cluster gateway endpoint
  - url: http://localhost:8080
    description: Local development gateway endpoint

paths:
  /v1/users/{userId}/presence:
    put:
      summary: Update user presence state
      description: >
        Update ephemeral presence status and custom status message for the authenticated user.
        Enforces caller_user_id == route_user_id. Mismatched caller IDs return 403 Forbidden.
      operationId: updateUserPresence
      tags:
        - Presence
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: Canonical UUID of the user whose presence is being updated
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePresenceRequest'
      responses:
        '200':
          description: Presence state updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPresence'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

    get:
      summary: Retrieve user presence state
      description: >
        Query current presence status of a user. If caller and target do not share a mutual conversation,
        the backend returns privacy-shielded OFFLINE state to prevent scraping or presence oracles.
      operationId: getUserPresence
      tags:
        - Presence
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: Canonical UUID of the user whose presence is queried
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Presence state retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPresence'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /v1/presence/me:
    put:
      summary: Update authenticated caller's presence state
      description: Convenience endpoint updating presence state for the authenticated session user.
      operationId: updateCallerPresence
      tags:
        - Presence
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePresenceRequest'
      responses:
        '200':
          description: Presence state updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPresence'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

    get:
      summary: Retrieve authenticated caller's presence state
      description: Convenience endpoint querying current presence state of the authenticated session user.
      operationId: getCallerPresence
      tags:
        - Presence
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Presence state retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPresence'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /v1/users/presence/batch:
    post:
      summary: Batch retrieve presence states
      description: >
        Batch query presence status for up to 100 users in a single round-trip.
        Users not sharing a mutual conversation with caller are automatically shielded as OFFLINE.
      operationId: batchGetUserPresence
      tags:
        - Presence
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGetPresenceRequest'
      responses:
        '200':
          description: Batch presence records retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPresence'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authenticated user bearer token issued by Auth Service.

  schemas:
    PresenceStatus:
      type: string
      enum:
        - online
        - away
        - busy
        - offline
      description: High-level presence status classification.

    UserPresence:
      type: object
      required:
        - user_id
        - status
        - last_active_unix_ms
      properties:
        user_id:
          type: string
          format: uuid
          description: Canonical UUID identifying the user.
        status:
          $ref: '#/components/schemas/PresenceStatus'
        last_active_unix_ms:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds of latest device activity.
        custom_status_message:
          type: string
          maxLength: 140
          description: Optional custom status message set by the user.

    UpdatePresenceRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/PresenceStatus'
        custom_status_message:
          type: string
          maxLength: 140
          description: Optional custom status message (sanitized and capped at 140 chars).

    BatchGetPresenceRequest:
      type: object
      required:
        - user_ids
      properties:
        user_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
          description: List of user IDs to query (max 100).

    ErrorResponse:
      type: object
      required:
        - error
        - request_id
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code.
            message:
              type: string
              description: Human-readable error description.
        request_id:
          type: string
          description: Correlation identifier for request tracing.

  responses:
    400BadRequest:
      description: Invalid request payload, malformed JSON, or missing required fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    401Unauthorized:
      description: Missing, expired, or invalid Bearer authentication token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    403Forbidden:
      description: Access forbidden (e.g. caller attempting to modify presence of another user).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    429TooManyRequests:
      description: Rate limit exceeded (e.g. presence update rate limit of 12 updates/min exceeded).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    503ServiceUnavailable:
      description: Downstream messaging service unavailable, circuit breaker open, or bulkhead rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
