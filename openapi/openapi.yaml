openapi: 3.0.3
info:
  title: SecureCloud Gateway REST API
  description: >
    SecureCloud API Gateway proxying client REST requests to downstream microservices
    (Auth, Messaging, Files, Audit) over gRPC. Invariant: Never performs direct database access on Gateway (ADR-005).
  version: 1.0.0
  contact:
    name: SecureCloud Engineering Team

servers:
  - url: https://api.securecloud.internal
    description: Internal cluster gateway endpoint
  - url: http://localhost:8080
    description: Local development gateway endpoint

paths:
  /v1/users/{userId}/presence:
    put:
      summary: Update user presence state
      description: >
        Update ephemeral presence status and custom status message for the authenticated user.
        Enforces caller_user_id == route_user_id. Mismatched caller IDs return 403 Forbidden.
      operationId: updateUserPresence
      tags:
        - Presence
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: Canonical UUID of the user whose presence is being updated
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePresenceRequest'
      responses:
        '200':
          description: Presence state updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPresence'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

    get:
      summary: Retrieve user presence state
      description: >
        Query current presence status of a user. If caller and target do not share a mutual conversation,
        the backend returns privacy-shielded OFFLINE state to prevent scraping or presence oracles.
      operationId: getUserPresence
      tags:
        - Presence
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: Canonical UUID of the user whose presence is queried
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Presence state retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPresence'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /v1/presence/me:
    put:
      summary: Update authenticated caller's presence state
      description: Convenience endpoint updating presence state for the authenticated session user.
      operationId: updateCallerPresence
      tags:
        - Presence
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePresenceRequest'
      responses:
        '200':
          description: Presence state updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPresence'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

    get:
      summary: Retrieve authenticated caller's presence state
      description: Convenience endpoint querying current presence state of the authenticated session user.
      operationId: getCallerPresence
      tags:
        - Presence
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Presence state retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPresence'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /v1/users/presence/batch:
    post:
      summary: Batch retrieve presence states
      description: >
        Batch query presence status for up to 100 users in a single round-trip.
        Users not sharing a mutual conversation with caller are automatically shielded as OFFLINE.
      operationId: batchGetUserPresence
      tags:
        - Presence
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGetPresenceRequest'
      responses:
        '200':
          description: Batch presence records retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPresence'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
  /api/v1/files/upload/init:
    post:
      summary: Initialize a resumable file upload session
      description: >
        Initiates a new chunked resumable upload session. The caller must match owner_user_id.
        Server returns upload_id and file_id.
      operationId: initUpload
      tags:
        - Files
      security:
        - bearerAuth: []
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
          description: Optional correlation identifier for request tracing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitUploadRequest'
      responses:
        '201':
          description: Upload session initialized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitUploadResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /api/v1/files/upload/chunk:
    post:
      summary: Upload an encrypted file chunk
      description: >
        Uploads an encrypted chunk (<= 5 MiB) associated with an active upload session.
      operationId: uploadChunk
      tags:
        - Files
      security:
        - bearerAuth: []
      parameters:
        - name: Upload-Id
          in: header
          required: true
          schema:
            type: string
          description: Active upload session ID.
        - name: Chunk-Index
          in: header
          required: true
          schema:
            type: integer
          description: 0-based chunk index.
        - name: X-Ciphertext-SHA256
          in: header
          required: false
          schema:
            type: string
          description: Hex SHA-256 integrity hash of this encrypted chunk.
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Chunk uploaded and staged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadChunkResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '413':
          description: Chunk size exceeds max allowed chunk size
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /api/v1/files/upload/finalize:
    post:
      summary: Finalize a resumable file upload session
      description: >
        Validates all chunks have been received and moves the file to AVAILABLE lifecycle state.
      operationId: finalizeUpload
      tags:
        - Files
      security:
        - bearerAuth: []
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeUploadRequest'
      responses:
        '200':
          description: File finalized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizeUploadResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /api/v1/files/upload/cancel:
    post:
      summary: Cancel an in-progress upload session
      description: >
        Aborts an upload session and cleans up any staged chunks.
      operationId: cancelUpload
      tags:
        - Files
      security:
        - bearerAuth: []
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelUploadRequest'
      responses:
        '200':
          description: Upload session cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelUploadResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /api/v1/files/{file_id}/metadata:
    get:
      summary: Retrieve encrypted file metadata
      description: >
        Retrieves metadata and encrypted header for the specified file.
        Requires ownership or valid X-File-Capability header.
      operationId: getFileMetadata
      tags:
        - Files
      security:
        - bearerAuth: []
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-File-Capability
          in: header
          required: false
          schema:
            type: string
          description: Ed25519-signed capability token for delegated access.
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: File metadata retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetadataResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /api/v1/files/{file_id}/chunks/{chunk_index}:
    get:
      summary: Download a single encrypted file chunk
      description: >
        Retrieves a single encrypted chunk by index.
      operationId: downloadChunk
      tags:
        - Files
      security:
        - bearerAuth: []
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: chunk_index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
        - name: X-File-Capability
          in: header
          required: false
          schema:
            type: string
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Encrypted chunk payload
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /api/v1/files/{file_id}/download:
    get:
      summary: Streaming chunked download of entire encrypted file
      description: >
        Streams all encrypted chunks sequentially with chunked transfer encoding and bounded memory footprint.
      operationId: downloadFileStreaming
      tags:
        - Files
      security:
        - bearerAuth: []
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-File-Capability
          in: header
          required: false
          schema:
            type: string
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Chunked encrypted binary stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /api/v1/files/{file_id}:
    delete:
      summary: Soft-delete / tombstone a file
      description: >
        Marks a file as DELETED / TOMBSTONE, immediately revoking access.
      operationId: deleteFile
      tags:
        - Files
      security:
        - bearerAuth: []
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: File deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteFileResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /v1/conversations/{conversationId}/messages:
    get:
      summary: Synchronize device-specific encrypted messages for a conversation
      description: >
        Retrieves ordered conversation messages for the authenticated device (`X-Device-Id`).
        Returns only the per-device encrypted envelope targeted to the calling device.
        Messages accepted prior to the calling device's enrollment omit `delivery_targets`
        (Zero-Retroactive-Synthesis Invariant, ADR-008).
      operationId: syncConversationMessages
      tags:
        - Messaging
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: since_sequence
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Synchronized message batch for the calling device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncMessagesResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /v1/conversations/{conversationId}/messages/{messageId}/delivery-status:
    get:
      summary: Query multi-device delivery and logical recipient read status
      description: >
        Returns the authoritative per-device delivery state breakdown (`device_statuses`)
        and per-user logical read status (`recipient_read_statuses`) for a message (MSG-008, MSG-011).
      operationId: getMessageDeliveryStatus
      tags:
        - Messaging
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Multi-device delivery summary and read status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDeliveryStatusResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          description: Message or conversation not found
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

components:
  parameters:
    DeviceIdHeader:
      name: X-Device-Id
      in: header
      required: true
      description: Canonical UUID of the authenticated calling physical device bound to the session.
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authenticated user bearer token issued by Auth Service.

  schemas:
    PresenceStatus:
      type: string
      enum:
        - online
        - away
        - busy
        - offline
      description: High-level presence status classification.

    UserPresence:
      type: object
      required:
        - user_id
        - status
        - last_active_unix_ms
      properties:
        user_id:
          type: string
          format: uuid
          description: Canonical UUID identifying the user.
        status:
          $ref: '#/components/schemas/PresenceStatus'
        last_active_unix_ms:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds of latest device activity.
        custom_status_message:
          type: string
          maxLength: 140
          description: Optional custom status message set by the user.

    UpdatePresenceRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/PresenceStatus'
        custom_status_message:
          type: string
          maxLength: 140
          description: Optional custom status message (sanitized and capped at 140 chars).

    BatchGetPresenceRequest:
      type: object
      required:
        - user_ids
      properties:
        user_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
          description: List of user IDs to query (max 100).

    EncryptedPayload:
      type: object
      required:
        - ciphertext_blob
        - algorithm
      properties:
        ciphertext_blob:
          type: string
          description: Device-specific AEAD ciphertext blob (opaque to server, ADR-008).
        ephemeral_public_key:
          type: string
        initialization_vector:
          type: string
        auth_tag:
          type: string
        algorithm:
          type: string
          example: XChaCha20-Poly1305

    PerDeviceDeliveryTarget:
      type: object
      required:
        - recipient_device_id
        - state
      properties:
        recipient_user_id:
          type: string
          format: uuid
        recipient_device_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [QUEUED, DELIVERING, DELIVERED, RETRY_WAIT, EXPIRED, UNSPECIFIED]
        updated_at_unix_ms:
          type: integer
          format: int64
        encrypted_payload:
          $ref: '#/components/schemas/EncryptedPayload'

    MessageEnvelope:
      type: object
      required:
        - message_id
        - conversation_id
        - sender_user_id
        - sender_device_id
        - delivery_targets
      properties:
        message_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sender_user_id:
          type: string
          format: uuid
        sender_device_id:
          type: string
          format: uuid
        priority:
          type: string
          enum: [normal, urgent, emergency]
        created_at_unix_ms:
          type: integer
          format: int64
        expires_at_unix_ms:
          type: integer
          format: int64
        client_idempotency_token:
          type: string
        delivery_targets:
          type: array
          items:
            $ref: '#/components/schemas/PerDeviceDeliveryTarget'

    SyncMessagesResponse:
      type: object
      required:
        - device_id
        - conversation_id
        - has_more
        - next_sequence
        - latest_sequence
        - messages
      properties:
        device_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        has_more:
          type: boolean
        next_sequence:
          type: integer
          format: int64
        latest_sequence:
          type: integer
          format: int64
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageEnvelope'

    DeviceDeliveryStatus:
      type: object
      required:
        - device_id
        - recipient_user_id
        - delivery_state
      properties:
        device_id:
          type: string
          format: uuid
        recipient_user_id:
          type: string
          format: uuid
        delivery_state:
          type: string
          enum: [QUEUED, DELIVERING, DELIVERED, RETRY_WAIT, EXPIRED, UNSPECIFIED]
        delivered_at_unix_ms:
          type: integer
          format: int64
        attempt_count:
          type: integer

    LogicalRecipientReadStatus:
      type: object
      required:
        - user_id
        - is_read
      properties:
        user_id:
          type: string
          format: uuid
        is_read:
          type: boolean
        read_at_unix_ms:
          type: integer
          format: int64
        reader_device_id:
          type: string
          format: uuid

    MessageDeliveryStatusResponse:
      type: object
      required:
        - message_id
        - conversation_id
        - summary
        - device_statuses
        - recipient_read_statuses
      properties:
        message_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        summary:
          type: object
          properties:
            total_targets:
              type: integer
            delivered_targets:
              type: integer
            pending_targets:
              type: integer
            expired_targets:
              type: integer
        device_statuses:
          type: array
          items:
            $ref: '#/components/schemas/DeviceDeliveryStatus'
        recipient_read_statuses:
          type: array
          items:
            $ref: '#/components/schemas/LogicalRecipientReadStatus'

    ErrorResponse:
      type: object
      required:
        - error
        - request_id
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code.
            message:
              type: string
              description: Human-readable error description.
        request_id:
          type: string
          description: Correlation identifier for request tracing.

    InitUploadRequest:
      type: object
      required:
        - encrypted_size_bytes
        - expected_chunk_count
      properties:
        file_id:
          type: string
          description: Optional pre-generated client file ID.
        owner_user_id:
          type: string
          format: uuid
          description: Owner user ID (must match caller context).
        owner_device_id:
          type: string
          description: Owner device ID.
        encrypted_size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Total ciphertext size in bytes.
        expected_chunk_count:
          type: integer
          minimum: 1
          description: Total number of chunks that will be uploaded.
        encryption_version:
          type: string
          description: Encryption scheme version (e.g. XChaCha20-Poly1305).

    InitUploadResponse:
      type: object
      required:
        - file_id
        - upload_id
        - status
        - expires_at_unix_ms
      properties:
        file_id:
          type: string
        upload_id:
          type: string
        status:
          type: string
          example: TRANSFER_STATUS_PENDING
        expires_at_unix_ms:
          type: integer
          format: int64

    UploadChunkResponse:
      type: object
      required:
        - upload_id
        - chunk_index
        - accepted
        - received_sha256
      properties:
        upload_id:
          type: string
        chunk_index:
          type: integer
        accepted:
          type: boolean
        received_sha256:
          type: string
          description: Hex SHA-256 hash computed over received chunk.

    FinalizeUploadRequest:
      type: object
      required:
        - upload_id
        - file_id
      properties:
        upload_id:
          type: string
        file_id:
          type: string
        expected_ciphertext_sha256:
          type: string
          description: Optional expected SHA-256 of the whole file.

    FinalizeUploadResponse:
      type: object
      required:
        - file_id
        - lifecycle_state
        - available_at_unix_ms
      properties:
        file_id:
          type: string
        lifecycle_state:
          type: string
          example: FILE_LIFECYCLE_STATE_AVAILABLE
        available_at_unix_ms:
          type: integer
          format: int64

    CancelUploadRequest:
      type: object
      required:
        - upload_id
      properties:
        upload_id:
          type: string
        reason:
          type: string

    CancelUploadResponse:
      type: object
      required:
        - upload_id
        - status
      properties:
        upload_id:
          type: string
        status:
          type: string
          example: TRANSFER_STATUS_CANCELLED

    FileMetadataResponse:
      type: object
      required:
        - file_id
        - encrypted_size_bytes
        - chunk_count
        - encryption_version
        - lifecycle_state
        - created_at_unix_ms
        - available_at_unix_ms
      properties:
        file_id:
          type: string
        encrypted_size_bytes:
          type: integer
          format: int64
        chunk_count:
          type: integer
        encryption_version:
          type: string
        lifecycle_state:
          type: string
          example: FILE_LIFECYCLE_STATE_AVAILABLE
        created_at_unix_ms:
          type: integer
          format: int64
        available_at_unix_ms:
          type: integer
          format: int64

    DeleteFileResponse:
      type: object
      required:
        - file_id
        - lifecycle_state
        - deleted
      properties:
        file_id:
          type: string
        lifecycle_state:
          type: string
          example: FILE_LIFECYCLE_STATE_DELETED
        deleted:
          type: boolean

  responses:
    400BadRequest:
      description: Invalid request payload, malformed JSON, or missing required fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    401Unauthorized:
      description: Missing, expired, or invalid Bearer authentication token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    403Forbidden:
      description: Access forbidden (e.g. caller attempting to modify presence of another user).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    404NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    429TooManyRequests:
      description: Rate limit exceeded (e.g. presence update rate limit of 12 updates/min exceeded).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    503ServiceUnavailable:
      description: Downstream messaging service unavailable, circuit breaker open, or bulkhead rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
